<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际模拟 · Interstellar Atlas</title>
<link rel="stylesheet" href="css/style.css?v=202">
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js?v=202",
    "three/addons/": "./lib/addons/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="loading">
  <!-- 背景：真实银河全景图（与场景天球同一张，顺带预加载） -->
  <div class="milkyway" aria-hidden="true"></div>
  <div class="sky" aria-hidden="true"><div class="stars"></div></div>

  <div class="stack">
    <div class="plate">
      <div class="kicker">INTERSTELLAR ATLAS</div>
      <h1>星际模拟</h1>
      <div class="rule"><i></i></div>
      <div class="meters">
        <div class="track"><i></i></div>
        <div class="pct">0%</div>
      </div>
      <div class="status"><span class="pulse"></span><b>正在校准星历表</b><em>CALIBRATING EPHEMERIS</em></div>
    </div>
  </div>
</div>

<!-- 启动屏动画：普通脚本，解析到这里立刻开始转，不等 three.js 模块链 -->
<script src="js/loading-boot.js?v=202"></script>
<script type="module" src="js/main.js?v=202"></script>
</body>
</html>
